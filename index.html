<!doctype html>
<html lang="en" data-theme="light" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFBrains - PDF tools, plain and simple</title>
    <meta
      name="description"
      content="Merge, split, compress and convert PDFs in seconds. No installs, no sign-up, no waiting. PDFBrains is the PDF toolbox for people who want the job done."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23161d29'/%3E%3Cpath d='M10.5 8.5h8.2l4.8 4.8V23.5h-13z' fill='%23f4f5f6'/%3E%3Cpath d='M18.7 8.5l4.8 4.8h-4.8z' fill='%23e8501e'/%3E%3C/svg%3E"
    />
    <script>
      // Set theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var saved = localStorage.getItem("pdfbrains-theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* storage unavailable, keep default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
