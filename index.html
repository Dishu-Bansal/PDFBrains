<html lang="en" data-theme="light" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Merge, split, compress and convert PDFs in seconds. No installs, no sign-up, no waiting. PDFBrains is the PDF toolbox for people who want the job done."
    />
    <link rel="canonical" href="https://pdfbrains.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#161d29" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDFBrains" />
    <meta property="og:title" content="PDFBrains - PDF tools, plain and simple" />
    <meta
      property="og:description"
      content="Merge, split, compress and convert PDFs in seconds. No installs, no sign-up, no waiting."
    />
    <meta property="og:url" content="https://pdfbrains.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PDFBrains - PDF tools, plain and simple" />
    <meta
      name="twitter:description"
      content="Merge, split, compress and convert PDFs in seconds. No installs, no sign-up, no waiting."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PDFBrains",
        "url": "https://pdfbrains.com/"
      }
    </script>
    <link rel="icon" href="/pdfbrains-logo.ico" sizes="48x48" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var saved = localStorage.getItem("pdfbrains-theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* storage unavailable, keep default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
